<style>
/* ── Tema Quiniela IA · fondo blanco ───────────────────────────────── */
:root {
  --bg:#ffffff; --sfc:#ffffff; --sfc2:#f8fafc; --brd:#e5e7eb; --brd2:#cbd5e1;
  --txt:#111827; --mut:#6b7280; --tenue:#9ca3af;
  --p1:#16a34a; --px:#d97706; --p2:#dc2626;
  --div1:#1d4ed8; --div2:#0f766e; --pleno:#be185d;
  --accent:#1d4ed8; --warn:#b45309; --danger:#dc2626;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; -webkit-text-size-adjust:100%; }
.wrap { max-width:900px; margin:0 auto; }

/* ── Cabecera ──────────────────────────────────────────────────────── */
.head { padding:14px 12px 10px; border-bottom:1px solid var(--brd); }
.head-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.titulo { font-weight:800; font-size:clamp(1.4rem,5vw,2rem); letter-spacing:-.02em; line-height:1; }
.titulo em { font-style:normal; color:var(--p1); }
.subtitulo { font-family:var(--mono); font-size:.58rem; color:var(--mut); letter-spacing:.1em; text-transform:uppercase; margin-top:4px; }
.head-der { text-align:right; }
.selector, .chip-j { font-family:var(--mono); font-size:.66rem; background:var(--sfc2); border:1px solid var(--brd); border-radius:6px; color:var(--txt); padding:4px 8px; }
.selector { cursor:pointer; }
.dato-mini { font-family:var(--mono); font-size:.6rem; color:var(--mut); margin-top:4px; }
.dato-bote { color:var(--p1); font-weight:600; }
.alerta { font-family:var(--mono); font-size:.64rem; padding:5px 8px; margin-top:4px; line-height:1.5; border-radius:6px; }
.alerta:first-of-type { margin-top:8px; }
.alerta.info { color:#1e40af; background:#eff6ff; border:1px solid #bfdbfe; }
.alerta.warn { color:#92400e; background:#fffbeb; border:1px solid #fde68a; }
.leyenda { display:flex; gap:10px; margin-top:7px; font-family:var(--mono); font-size:.6rem; color:var(--mut); flex-wrap:wrap; }

/* ── Pestañas ──────────────────────────────────────────────────────── */
.tabs { display:flex; border-bottom:1px solid var(--brd); }
.tab { flex:1; font-family:var(--mono); font-size:.68rem; background:transparent; border:none; padding:10px 4px; color:var(--mut); border-bottom:2px solid transparent; cursor:pointer; text-transform:uppercase; }
.tab.on { color:var(--txt); border-bottom-color:var(--txt); font-weight:600; }

/* ── Tarjeta de partido ────────────────────────────────────────────── */
.lista { padding:10px 11px 0; }
.card { background:var(--sfc); border:1px solid var(--brd); border-radius:10px; padding:10px 11px; margin-bottom:6px; cursor:pointer; }
.card:hover { border-color:var(--brd2); }
.card.abierta { border-color:var(--brd2); background:var(--sfc2); }
.card.susp { border-color:#fcd34d; }
.card.urgente { border-color:#fca5a5; }
.card-aviso { font-family:var(--mono); font-size:.58rem; margin-bottom:4px; }
.card-aviso.warn { color:var(--warn); }
.card-aviso.danger { color:var(--danger); }
.card-aviso.info { color:var(--accent); }
.card-aviso.doble { color:#6d28d9; font-weight:600; }
.card.doble { border-color:#c4b5fd; }
.signo.doble { font-size:.92rem; letter-spacing:.04em; }
.sello { display:inline-block; font-family:var(--mono); font-size:.56rem; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:5px; padding:2px 6px; margin-top:5px; }
.linea.doble .eq { color:#4c1d95; }
.sg-doble { width:auto !important; color:#6d28d9 !important; font-size:.72rem !important; }
.et-doble { color:#6d28d9; }
.fila { display:grid; grid-template-columns:28px 1fr auto 1fr auto; gap:6px; align-items:center; }
.num { text-align:center; }
.num b { display:block; font-family:var(--mono); font-size:.8rem; font-weight:700; color:var(--tenue); line-height:1.1; }
.num span { font-family:var(--mono); font-size:.56rem; font-weight:600; }
.equipo { display:flex; align-items:center; gap:6px; min-width:0; }
.equipo.der { flex-direction:row-reverse; text-align:right; }
.equipo .emoji { font-size:.85rem; flex-shrink:0; }
.equipo .nombre { font-size:.82rem; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.equipo .nota { font-family:var(--mono); font-size:.56rem; color:var(--accent); }
.vs { text-align:center; min-width:42px; }
.vs .dia { font-family:var(--mono); font-size:.55rem; color:var(--mut); }
.vs .x { font-weight:700; font-size:.7rem; color:var(--tenue); }
.pred { display:flex; flex-direction:column; align-items:flex-end; min-width:84px; gap:3px; }
.signo { font-weight:800; font-size:1.1rem; padding:1px 9px; border-radius:6px; }
.marcador { font-weight:800; font-size:.95rem; padding:2px 9px; border-radius:6px; color:var(--pleno); border:1px solid #f9a8d4; background:#fdf2f8; }
.et-pleno { font-family:var(--mono); font-size:.55rem; color:var(--pleno); margin-top:1px; text-align:right; }
.barra { display:flex; gap:1px; width:100%; height:4px; }
.barra i { height:100%; border-radius:2px; }
.pcts { font-family:var(--mono); font-size:.56rem; color:var(--mut); display:flex; gap:3px; }
.conf { font-family:var(--mono); font-size:.56rem; font-weight:600; }

/* ── Panel expandido ───────────────────────────────────────────────── */
.detalle { margin-top:10px; padding-top:10px; border-top:1px solid var(--brd); }
.razon { font-size:.78rem; color:#374151; line-height:1.6; margin-bottom:7px; }
.bajas { font-family:var(--mono); font-size:.64rem; color:var(--danger); margin-bottom:7px; }
.lae { margin-top:6px; }
.lae .barra { height:5px; }
.lae .pie { display:flex; gap:6px; font-family:var(--mono); font-size:.62rem; color:var(--mut); margin-top:4px; }
.lae .pie .et { margin-left:4px; color:var(--tenue); }
.goles { font-family:var(--mono); font-size:.62rem; color:var(--mut); margin-top:6px; line-height:1.7; }
.goles .cab { color:var(--pleno); font-weight:600; margin-bottom:2px; }

/* ── Alineaciones ──────────────────────────────────────────────────── */
.once { margin-top:10px; padding-top:9px; border-top:1px dashed var(--brd); }
.once-cab { font-family:var(--mono); font-size:.58rem; color:var(--mut); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
.once-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.once-eq { font-family:var(--mono); font-size:.6rem; font-weight:600; color:var(--txt); margin-bottom:4px; }
.once-lista { list-style:none; }
.jug { display:grid; grid-template-columns:1fr 34px 30px; gap:5px; align-items:center; font-family:var(--mono); font-size:.62rem; color:#374151; padding:1.5px 0; }
.jug .nom { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jug .pista { height:4px; background:var(--brd); border-radius:2px; overflow:hidden; }
.jug .pista i { display:block; height:100%; border-radius:2px; }
.jug .pct { text-align:right; color:var(--mut); font-variant-numeric:tabular-nums; }
.jug.dudoso .nom, .jug.dudoso .pct { color:var(--tenue); }
.once-corte { border-top:1px dashed var(--brd); margin:5px 0 4px; padding-top:4px; font-family:var(--mono); font-size:.54rem; color:var(--tenue); text-transform:uppercase; letter-spacing:.06em; }
.once-vacio { font-family:var(--mono); font-size:.62rem; color:var(--mut); background:var(--sfc2); border:1px solid var(--brd); border-radius:6px; padding:6px 8px; line-height:1.5; }

/* ── Marca de aciertos ─────────────────────────────────────────────── */
.marca { border-radius:10px; padding:11px 13px; margin-bottom:8px; border:1px solid; }
.marca.bien    { background:#f0fdf4; border-color:#bbf7d0; }
.marca.regular { background:#fffbeb; border-color:#fde68a; }
.marca.mal     { background:#fef2f2; border-color:#fecaca; }
.marca-top { display:flex; align-items:center; gap:12px; }
.marca-num { font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap; }
.marca-num b { font-size:1.65rem; font-weight:800; }
.marca-num span { font-size:.85rem; color:var(--mut); }
.marca.bien .marca-num b    { color:#15803d; }
.marca.regular .marca-num b { color:#b45309; }
.marca.mal .marca-num b     { color:#b91c1c; }
.marca-tit { font-size:.76rem; font-weight:600; line-height:1.3; }
.marca-sub { font-family:var(--mono); font-size:.6rem; color:var(--mut); margin-top:3px; line-height:1.5; }
.marca-hist { font-family:var(--mono); font-size:.6rem; color:var(--mut); margin-top:8px; padding-top:7px; border-top:1px dashed rgba(0,0,0,.12); }
.marca-hist b { color:var(--txt); }

.card.ok { border-color:#bbf7d0; }
.card.ko { border-color:#fecaca; }
.real { font-family:var(--mono); font-size:.6rem; margin-top:7px; padding-top:6px; border-top:1px solid var(--brd); }
.real.ok { color:#15803d; }
.real.ko { color:#b91c1c; }
.tick { font-size:.66rem; width:12px; flex-shrink:0; text-align:center; }
.tick.ok { color:var(--p1); }
.tick.ko { color:var(--p2); }

/* ── Boleto ────────────────────────────────────────────────────────── */
.boleto { background:var(--sfc2); border:1px solid var(--brd); border-radius:10px; padding:12px 13px; margin-top:8px; }
.boleto-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px; }
.boleto-tit { font-weight:800; font-size:.9rem; letter-spacing:-.01em; }
.boleto-sub { font-family:var(--mono); font-size:.58rem; color:var(--mut); margin-top:2px; }
.btn-copiar { font-family:var(--mono); font-size:.64rem; background:#fff; color:var(--txt); border:1px solid var(--brd2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
.btn-copiar:hover { background:#f1f5f9; }
.btn-copiar.ok { background:var(--p1); border-color:var(--p1); color:#fff; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
.col-cab { font-family:var(--mono); font-size:.58rem; letter-spacing:.08em; margin-bottom:4px; font-weight:600; }
.linea { display:flex; gap:5px; align-items:center; padding:4px 0; border-bottom:1px solid var(--brd); font-family:var(--mono); }
.linea .n { color:var(--tenue); width:13px; flex-shrink:0; font-size:.58rem; }
.linea .eq { flex:1; color:#374151; font-size:.66rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.linea .sg { font-weight:800; font-size:.82rem; width:13px; text-align:center; flex-shrink:0; }
.bloque-pleno { margin-top:7px; padding-top:6px; border-top:1px solid var(--brd2); }
.resumen { display:flex; gap:11px; font-family:var(--mono); font-size:.62rem; color:var(--mut); margin-top:9px; flex-wrap:wrap; }
.pie-app { font-family:var(--mono); font-size:.56rem; color:var(--tenue); padding:10px 11px 22px; text-align:center; line-height:1.6; }
.pie-toca { font-family:var(--mono); font-size:.58rem; color:var(--tenue); text-align:center; margin:8px 0; }

@media (max-width:420px) {
  .once-cols, .cols { grid-template-columns:1fr; }
  .bloque-pleno { margin-top:9px; }
}
</style>

// ── Utilidades ──────────────────────────────────────────────────────
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const varPred = p => p === '1' ? 'var(--p1)' : p === 'X' ? 'var(--px)' : 'var(--p2)';
const bgPred  = p => p === '1' ? '#f0fdf4' : p === 'X' ? '#fffbeb' : '#fef2f2';
const bdPred  = p => p === '1' ? '#bbf7d0' : p === 'X' ? '#fde68a' : '#fecaca';
const varConf = c => c === 'ALTA' ? 'var(--p1)' : c === 'MEDIA' ? 'var(--px)' : 'var(--mut)';
const varDiv  = d => d === '1ª' ? 'var(--div1)' : d === '2ª' ? 'var(--div2)' : 'var(--pleno)';

// Siglas de club que no aportan nada en el boleto compacto.
// Sin "Real" a proposito: "Real Sociedad" y "Real Madrid" se quedan enteros.
const RUIDO = new Set(['fc','cf','cd','rcd','rc','sd','ud','ad','ce','sad','bp','dep','dep.','r.']);
function nombreCorto(nombre) {
  const partes = String(nombre).split(' ').filter(Boolean);
  const limpio = partes.filter(w => !RUIDO.has(w.toLowerCase()));
  return limpio.length ? limpio.join(' ') : nombre;
}

// ── Estado ──────────────────────────────────────────────────────────
let idxJornada = 0;
let filtro = 'todos';
let expandido = null;
let DOBLES = new Map();   // num de partido -> { alt, margen }

// ── Dobles ──────────────────────────────────────────────────────────
// Se doblan los partidos mas ajustados: aquellos donde el pronostico gana por
// menos margen a su mejor alternativa. A igualdad de margen, primero los de
// confianza BAJA. Cambiar N_DOBLES cambia cuantos se marcan.
const N_DOBLES = 2;
const ORDEN = ['1', 'X', '2'];

function calcDobles(partidos) {
  const candidatos = partidos
    .filter(p => !p.suspendido)   // un partido por sorteo no merece gastar un doble
    .map(p => {
      const prob = { '1': p.p1, 'X': p.px, '2': p.p2 };
      const alt = ORDEN.filter(s => s !== p.pred).sort((a, b) => prob[b] - prob[a])[0];
      return { num: p.num, alt, margen: Math.abs(prob[p.pred] - prob[alt]), conf: p.conf };
    })
    .sort((a, b) => a.margen - b.margen ||
      (a.conf === 'BAJA' ? 0 : 1) - (b.conf === 'BAJA' ? 0 : 1));

  return new Map(candidatos.slice(0, N_DOBLES).map(d => [d.num, d]));
}

// "X" + alternativa "1" -> "1X" (siempre en orden 1-X-2)
const signosDoble = (pred, alt) => ORDEN.filter(s => s === pred || s === alt).join('');

// ── Aciertos ────────────────────────────────────────────────────────
// Solo cuenta los partidos que ya tienen `resultado`. Se calculan dos marcas:
// el boleto simple (solo el pronostico) y el real (pronostico + dobles), para
// poder ver si los dobles han servido de algo.
function calcAciertos(j) {
  const dobles = calcDobles(j.partidos);
  const jugados = j.partidos.filter(p => p.resultado);
  if (!jugados.length) return null;

  let simple = 0, conDobles = 0;
  for (const p of jugados) {
    const d = dobles.get(p.num);
    const okSimple = p.resultado === p.pred;
    if (okSimple) simple++;
    if (okSimple || (d && p.resultado === d.alt)) conDobles++;
  }

  const plenoOk = j.pleno.resultado_marcador
    ? j.pleno.resultado_marcador === j.pleno.pred_marcador
    : null;

  return {
    jugados: jugados.length,
    total: j.partidos.length,
    simple, conDobles,
    rescatados: conDobles - simple,
    plenoOk,
    completa: jugados.length === j.partidos.length,
  };
}

// Acumulado de todas las jornadas que ya tienen resultados
function calcHistorico() {
  const conRes = JORNADAS.map(j => ({ j, a: calcAciertos(j) })).filter(x => x.a);
  if (conRes.length < 2) return null;
  return {
    jornadas: conRes.length,
    jugados: conRes.reduce((s, x) => s + x.a.jugados, 0),
    conDobles: conRes.reduce((s, x) => s + x.a.conDobles, 0),
    simple: conRes.reduce((s, x) => s + x.a.simple, 0),
    plenos: conRes.filter(x => x.a.plenoOk === true).length,
    plenosJugados: conRes.filter(x => x.a.plenoOk !== null).length,
    detalle: conRes.map(x => ({ et: etiqueta(x.j), aciertos: x.a.conDobles, de: x.a.jugados })),
  };
}

function tplAciertos(j) {
  const a = calcAciertos(j);
  if (!a) return '';

  const pct = Math.round((a.conDobles / a.jugados) * 100);
  const tono = pct >= 71 ? 'bien' : pct >= 50 ? 'regular' : 'mal';

  const h = calcHistorico();
  const histTxt = h
    ? `<div class="marca-hist">Histórico: <b>${h.conDobles}/${h.jugados}</b> (${Math.round((h.conDobles / h.jugados) * 100)}%) en ${h.jornadas} jornadas${h.plenosJugados ? ` · Pleno ${h.plenos}/${h.plenosJugados}` : ''}</div>`
    : '';

  return `<div class="marca ${tono}">
    <div class="marca-top">
      <div class="marca-num"><b>${a.conDobles}</b><span>/${a.jugados}</span></div>
      <div class="marca-txt">
        <div class="marca-tit">${a.completa ? 'Aciertos de la jornada' : `Aciertos provisionales · ${a.jugados} de ${a.total} partidos jugados`}</div>
        <div class="marca-sub">
          ${pct}% acertado · boleto simple ${a.simple}/${a.jugados}${a.rescatados ? ` · los dobles rescataron ${a.rescatados}` : ' · los dobles no han sumado'}
          ${a.plenoOk === null ? '' : ` · Pleno al 15 ${a.plenoOk ? '✓' : '✗'}`}
        </div>
      </div>
    </div>
    ${histTxt}
  </div>`;
}

// ── Plantillas ──────────────────────────────────────────────────────
function barra(a, b, c) {
  return `<div class="barra">
    <i style="width:${a}%;background:var(--p1)"></i>
    <i style="width:${b}%;background:var(--px)"></i>
    <i style="width:${c}%;background:var(--p2)"></i>
  </div>`;
}

// Alineaciones probables. Fuente unica: futbolfantasy.com, que solo cubre
// Primera. Si no hay datos NO se inventan: se dice por que faltan.
function tplAlineaciones(p) {
  const a = p.alineaciones;
  const hay = a && Array.isArray(a.local) && a.local.length && Array.isArray(a.visit) && a.visit.length;

  if (!hay) {
    const fuente = p.div === '2ª' ? 'futbolfantasy.com/laliga2' : 'futbolfantasy.com/laliga';
    return `<div class="once">
      <div class="once-cab">Alineaciones probables</div>
      <div class="once-vacio">Aún no publicadas en ${fuente} para esta jornada.</div>
    </div>`;
  }

  // Cada jugador es {n, p}: nombre y % de titularidad segun futbolfantasy.
  // Se admite tambien un string suelto, sin porcentaje.
  const jugador = (j, dudoso) => {
    const nom = typeof j === 'string' ? j : j.n;
    const pct = typeof j === 'string' ? null : j.p;
    const color = pct == null ? 'var(--tenue)' : pct >= 75 ? 'var(--p1)' : pct >= 50 ? 'var(--px)' : 'var(--p2)';
    return `<li class="jug${dudoso ? ' dudoso' : ''}">
      <span class="nom">${esc(nom)}</span>
      <span class="pista"><i style="width:${pct == null ? 0 : pct}%;background:${color}"></i></span>
      <span class="pct">${pct == null ? '—' : pct + '%'}</span>
    </li>`;
  };

  const col = (equipo, once) => {
    const titulares = once.slice(0, 11);
    const resto = once.slice(11);
    return `<div>
      <div class="once-eq">${esc(equipo)}</div>
      <ul class="once-lista">
        ${titulares.map(j => jugador(j, false)).join('')}
        ${resto.length ? `<li class="once-corte">Resto de la plantilla (${resto.length})</li>` + resto.map(j => jugador(j, true)).join('') : ''}
      </ul>
    </div>`;
  };

  return `<div class="once">
    <div class="once-cab">% titularidad · futbolfantasy.com${a.actualizado ? ' · ' + esc(a.actualizado) : ''}</div>
    <div class="once-cols">
      ${col(p.local, a.local)}
      ${col(p.visit, a.visit)}
    </div>
  </div>`;
}

function tplPartido(p) {
  const abierta = expandido === p.num;
  const esPleno = p.div === 'P15';
  const clases = ['card'];
  if (abierta) clases.push('abierta');
  else if (p.suspendido) clases.push('susp');
  else if (p.urgente) clases.push('urgente');

  const doble = DOBLES.get(p.num);
  if (doble) clases.push('doble');

  // Resultado real, si ya se ha jugado
  const real = esPleno ? p.resultado_marcador : p.resultado;
  // Boolean() a proposito: sin el, "false || (undefined && ...)" da undefined
  // y la comparacion con false de mas abajo no entraria nunca.
  const acertado = real
    ? Boolean(esPleno ? real === p.pred_marcador
                      : real === p.pred || (doble && real === doble.alt))
    : null;
  if (acertado === true) clases.push('ok');
  else if (acertado === false) clases.push('ko');

  const avisos = [
    doble        ? `<div class="card-aviso doble">◧ DOBLE ${signosDoble(p.pred, doble.alt)} — solo ${doble.margen} ${doble.margen === 1 ? 'punto' : 'puntos'} de diferencia</div>` : '',
    p.suspendido ? '<div class="card-aviso warn">⚠ SUSPENDIDO — resultado por sorteo LAE</div>' : '',
    p.urgente    ? '<div class="card-aviso danger">⚡ PARTIDO CLAVE</div>' : '',
    p.local_nota ? `<div class="card-aviso info">${esc(p.local_nota)}</div>` : '',
  ].join('');

  const pred = esPleno
    ? `<div class="marcador">${esc(p.pred_marcador)}</div><div class="et-pleno">PLENO</div>`
    : `<div class="signo${doble ? ' doble' : ''}" style="color:${varPred(p.pred)};border:1px solid ${bdPred(p.pred)};background:${bgPred(p.pred)}">${doble ? esc(signosDoble(p.pred, doble.alt)) : esc(p.pred)}</div>
       ${barra(p.p1, p.px, p.p2)}
       <div class="pcts"><span style="color:var(--p1)">1</span>${p.p1}%<span style="color:var(--px)">X</span>${p.px}%<span style="color:var(--p2)">2</span>${p.p2}%</div>
       <div class="conf" style="color:${varConf(p.conf)}">● ${esc(p.conf)}</div>`;

  let detalle = '';
  if (abierta) {
    const lae = esPleno
      ? `<div class="goles">
           <div class="cab">% LAE goles · ${esc(p.local)} / ${esc(p.visit)}</div>
           <div>Local: ${['0','1','2','M'].map((g, i) => `${g}:${p.lae_p15_local[i]}%`).join(' · ')}</div>
           <div>Visit: ${['0','1','2','M'].map((g, i) => `${g}:${p.lae_p15_visit[i]}%`).join(' · ')}</div>
         </div>`
      : `<div class="lae">${barra(p.lae_1, p.lae_x, p.lae_2)}
           <div class="pie"><span style="color:var(--p1)">1</span>${p.lae_1}%<span style="color:var(--px)">X</span>${p.lae_x}%<span style="color:var(--p2)">2</span>${p.lae_2}%<span class="et">% LAE</span></div>
         </div>`;
    detalle = `<div class="detalle">
      <div class="razon">💡 ${esc(p.razon)}</div>
      ${p.bajas ? `<div class="bajas">⚕ ${esc(p.bajas)}</div>` : ''}
      ${lae}
      ${tplAlineaciones(p)}
    </div>`;
  }

  return `<div class="${clases.join(' ')}" data-num="${p.num}">
    ${avisos}
    <div class="fila">
      <div class="num"><b>${p.num}</b><span style="color:${varDiv(p.div)}">${esc(p.div)}</span></div>
      <div class="equipo">
        <span class="emoji">${esc(p.local_emoji)}</span>
        <div style="min-width:0"><div class="nombre">${esc(p.local)}</div></div>
      </div>
      <div class="vs"><div class="dia">${esc(p.dia)}</div><div class="x">VS</div></div>
      <div class="equipo der">
        <span class="emoji">${esc(p.visit_emoji)}</span>
        <div style="min-width:0">
          <div class="nombre">${esc(p.visit)}</div>
          ${p.visit_nota ? `<div class="nota">${esc(p.visit_nota)}</div>` : ''}
        </div>
      </div>
      <div class="pred">${pred}</div>
    </div>
    ${real ? `<div class="real ${acertado ? 'ok' : 'ko'}">
      ${acertado ? '✓' : '✗'} Resultado real: <b>${esc(real)}</b>${acertado ? '' : ` — pronosticamos ${esc(esPleno ? p.pred_marcador : (doble ? signosDoble(p.pred, doble.alt) : p.pred))}`}
    </div>` : ''}
    ${detalle}
  </div>`;
}

function tplBoleto(j) {
  const { partidos, pleno } = j;
  const linea = p => {
    const d = DOBLES.get(p.num);
    const ok = p.resultado ? Boolean(p.resultado === p.pred || (d && p.resultado === d.alt)) : null;
    return `<div class="linea${d ? ' doble' : ''}">
      <span class="n">${p.num}</span>
      <span class="eq">${esc(nombreCorto(p.local))} — ${esc(nombreCorto(p.visit))}</span>
      <span class="sg${d ? ' sg-doble' : ''}" style="color:${varPred(p.pred)}">${d ? esc(signosDoble(p.pred, d.alt)) : esc(p.pred)}</span>
      ${ok === null ? '' : `<span class="tick ${ok ? 'ok' : 'ko'}">${ok ? '✓' : '✗'}</span>`}
    </div>`;
  };

  const resumen = ['1', 'X', '2'].map(r => {
    const n = partidos.filter(p => p.pred === r).length;
    return n ? `<span><span style="color:${varPred(r)};font-weight:700">${r}</span> ×${n}</span>` : '';
  }).join('');

  const nD = DOBLES.size;
  const apuestas = Math.pow(2, nD);

  return `<div class="boleto">
    <div class="boleto-top">
      <div>
        <div class="boleto-tit">Boleto oficial · ${esc(etiqueta(j))}</div>
        <div class="boleto-sub">${partidos.length} partidos + Pleno al 15${nD ? ` · ${nD} ${nD === 1 ? 'doble' : 'dobles'} = ${apuestas} apuestas` : ''}</div>
      </div>
      <button class="btn-copiar" id="copiar">📋 Copiar</button>
    </div>
    <div class="cols">
      <div>
        <div class="col-cab" style="color:var(--div1)">1ª DIV</div>
        ${partidos.filter(p => p.div === '1ª').map(linea).join('')}
      </div>
      <div>
        <div class="col-cab" style="color:var(--div2)">2ª DIV</div>
        ${partidos.filter(p => p.div === '2ª').map(linea).join('')}
        <div class="bloque-pleno">
          <div class="col-cab" style="color:var(--pleno)">PLENO AL 15</div>
          <div class="linea" style="border:none">
            <span class="n">${pleno.num}</span>
            <span class="eq">${esc(nombreCorto(pleno.local))} — ${esc(nombreCorto(pleno.visit))}</span>
            <span class="sg" style="color:var(--pleno);width:auto">${esc(pleno.pred_marcador)}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="resumen">${resumen}<span style="color:var(--pleno)">P15: ${esc(pleno.pred_marcador)}</span>${nD ? `<span class="et-doble">◧ dobles: ${[...DOBLES.keys()].sort((a, b) => a - b).join(' y ')}</span>` : ''}</div>
  </div>`;
}

const etiqueta = j => `J${j.meta.jornada} · ${j.meta.temporada}`;

function render() {
  const j = JORNADAS[idxJornada];
  const { meta, contexto, partidos, pleno } = j;
  const plenoItem = Object.assign({}, pleno, { num: pleno.num || 15, div: 'P15' });

  DOBLES = calcDobles(partidos);

  const lista =
    filtro === 'todos' ? partidos.concat([plenoItem]) :
    filtro === '1a'    ? partidos.filter(p => p.div === '1ª') :
                         partidos.filter(p => p.div === '2ª').concat([plenoItem]);

  const n1a = partidos.filter(p => p.div === '1ª').length;
  const n2a = partidos.filter(p => p.div === '2ª').length;

  const selector = JORNADAS.length > 1
    ? `<select class="selector" id="selJornada">${JORNADAS.map((x, i) =>
        `<option value="${i}" ${i === idxJornada ? 'selected' : ''}>${esc(etiqueta(x))}</option>`).join('')}</select>`
    : `<div class="chip-j">${esc(etiqueta(j))}</div>`;

  const cierre = new Date(meta.fecha_cierre);
  const cierreTxt = isNaN(cierre) ? '' :
    `<div class="dato-mini">cierre ${cierre.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</div>`;

  // Sello de actualizacion: cuando se refrescaron los datos de esta jornada
  const act = new Date(meta.actualizado || meta.fecha_datos);
  const actTxt = isNaN(act) ? '' :
    `<div class="sello">↻ Actualizado ${act.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</div>`;

  document.getElementById('app').innerHTML = `
    <div class="head">
      <div class="head-top">
        <div>
          <div class="titulo">Quiniela <em>IA</em></div>
          <div class="subtitulo">${esc(etiqueta(j))} · Boleto oficial Loterías</div>
          ${actTxt}
        </div>
        <div class="head-der">
          ${selector}
          ${cierreTxt}
          ${meta.bote ? `<div class="dato-mini dato-bote">bote ${meta.bote.toLocaleString('es-ES')}€</div>` : ''}
        </div>
      </div>
      ${(contexto.alertas || []).map(a =>
        `<div class="alerta ${a.trim().charAt(0) === '⚠' ? 'warn' : 'info'}">${esc(a)}</div>`).join('')}
      <div class="leyenda">
        <span style="color:var(--div1)">■ 1ª División</span>
        <span style="color:var(--div2)">■ 2ª División</span>
        <span style="color:var(--pleno)">■ Pleno al 15</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${filtro === 'todos' ? 'on' : ''}" data-filtro="todos">Todos (${partidos.length}+P15)</button>
      <button class="tab ${filtro === '1a' ? 'on' : ''}" data-filtro="1a">1ª División (${n1a})</button>
      <button class="tab ${filtro === '2a' ? 'on' : ''}" data-filtro="2a">2ª + Pleno (${n2a}+1)</button>
    </div>

    <div class="lista">
      ${tplAciertos(j)}
      ${lista.map(tplPartido).join('')}
      <div class="pie-toca">Toca cada partido · análisis · lesionados · % LAE · alineaciones</div>
      ${filtro === 'todos' ? tplBoleto(j) : ''}
    </div>
    <div class="pie-app">⚠ Solo orientativo · % LAE y pronósticos: ${esc(meta.fuente)} · ${esc(meta.fecha_datos)}<br>Alineaciones probables: futbolfantasy.com</div>`;
}

// ── Eventos (delegados: el HTML se regenera en cada render) ─────────
document.getElementById('app').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { filtro = tab.dataset.filtro; expandido = null; render(); return; }

  if (e.target.closest('#copiar')) { copiarBoleto(); return; }

  const card = e.target.closest('.card');
  if (card) {
    const num = Number(card.dataset.num);
    expandido = expandido === num ? null : num;
    render();
  }
});

document.getElementById('app').addEventListener('change', e => {
  if (e.target.id === 'selJornada') {
    idxJornada = Number(e.target.value);
    filtro = 'todos';
    expandido = null;
    render();
  }
});

function copiarBoleto() {
  const { partidos, pleno } = JORNADAS[idxJornada];
  const txt = partidos.map(p => {
    const d = DOBLES.get(p.num);
    return `${p.num}. ${p.local} - ${p.visit}: ${d ? signosDoble(p.pred, d.alt) + ' (doble)' : p.pred}`;
  }).join('\n') +
    `\n${pleno.num || 15}. ${pleno.local} - ${pleno.visit}: ${pleno.pred_marcador} (Pleno)` +
    (DOBLES.size ? `\n${DOBLES.size} ${DOBLES.size === 1 ? 'doble' : 'dobles'} = ${Math.pow(2, DOBLES.size)} apuestas` : '');
  const btn = document.getElementById('copiar');
  const ok = () => { btn.textContent = '✓ Copiado'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = '📋 Copiar'; btn.classList.remove('ok'); }, 2000); };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(ok, () => copiaManual(txt, ok));
  } else {
    copiaManual(txt, ok);
  }
}

// Respaldo para file:// y navegadores sin permiso de portapapeles
function copiaManual(txt, ok) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;top:-1000px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); ok(); } catch (_) { prompt('Copia el boleto:', txt); }
  document.body.removeChild(ta);
}

render();

// ── Instalable como app (PWA) ───────────────────────────────────────
// Solo tiene sentido servido por http(s): abierto con doble clic desde
// file:// no hay service worker, y no pasa nada.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
